services:
  - type: worker
    name: quotex-ai-telegram-bot
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TWELVEDATA_API_KEY
        sync: false
      - key: PAIRS
        value: EUR/USD,GBP/USD,USD/JPY,USD/CHF,AUD/USD,USD/CAD,NZD/USD
      - key: INTERVAL
        value: 1min
      - key: POLL_SECONDS
        value: "60"
      - key: MIN_SCORE
        value: "4"
